name: Documentation check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Iedere maandag om 09:00 Nederlandse zomertijd / 08:00 wintertijd.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controleer documentatie
        shell: pwsh
        run: ./scripts/check-docs.ps1
