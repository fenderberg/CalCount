[build]
  command = "npm run build:web"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[functions.api]
  included_files = ["node_modules/.prisma/client/**"]

# Frontend calls /api/* and /health as relative paths (see web/src/api.ts) —
# route both to the one Fastify-in-Lambda function, path unchanged.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200

# SPA fallback for the PWA routes. Must come after the API redirects above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
